<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO: populated by main.js from config.js -->
  <title>Adam Reeves | Personal Finance Coach</title>
  <meta name="description" content="" />
  <link rel="canonical" href="" />
   <meta name="robots" content="noindex, nofollow">
  <!-- Open Graph -->
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:image" content="" />
  <meta property="og:url" content="" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="" />
  <meta name="twitter:title" content="" />
  <meta name="twitter:description" content="" />

  <!-- JSON-LD Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Adam Reeves",
    "jobTitle": "Certified Financial Coach",
    "url": "https://adamreevescoach.com",
    "sameAs": ["https://linkedin.com/in/adamreeves"],
    "description": "Personalized financial coaching helping young professionals budget, eliminate debt, and invest with confidence.",
    "offers": {
      "@type": "Service",
      "serviceType": "Financial Coaching",
      "areaServed": "Worldwide",
      "availableChannel": {
        "@type": "ServiceChannel",
        "serviceUrl": "https://adamreevescoach.com",
        "availableLanguage": "English"
      }
    }
  }
  </script>

  <!-- Favicon (SVG emoji fallback) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />

  <!-- Google Analytics (replace G-XXXXXXXXXX in config.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       NAVIGATION
  ═══════════════════════════════════════════════════════ -->
  <header id="main-nav" role="banner">
    <div class="container">
      <nav class="nav-inner" aria-label="Main navigation">
        <a href="#" id="nav-logo" aria-label="Adam Reeves home">Adam Reeves</a>

        <button
          id="nav-toggle"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div id="nav-menu">
          <ul id="nav-links" role="list"></ul>
          <a id="nav-cta" href="#booking" class="btn btn-primary">Book Free Call</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="main-content">

    <!-- ═══════════════════════════════════════════════════
         HERO
    ═══════════════════════════════════════════════════ -->
    <section id="hero" aria-labelledby="hero-headline">
      <div class="container">
        <div class="hero-inner">
          <div class="hero-text">
            <h1 id="hero-headline"></h1>
            <p id="hero-subtext"></p>
            <div class="hero-ctas">
              <a id="hero-primary-cta" href="#booking" class="btn btn-primary" target="_blank" rel="noopener">Book a Free Call</a>
              <a id="hero-secondary-cta" href="#services" class="btn btn-outline">See My Services</a>
            </div>
            <div class="hero-trust" aria-label="Client satisfaction">
              <div class="hero-trust-stars" aria-hidden="true">★★★★★</div>
              <span class="hero-trust-text">200+ clients helped — 5-star rated</span>
            </div>
          </div>

          <div class="hero-image-wrap">
            <img
              id="hero-image"
              src=""
              alt="Adam Reeves, Certified Financial Coach"
              loading="eager"
              width="480"
              height="540"
            />
            <div class="hero-badge" aria-hidden="true">
              <span class="hero-badge-icon">🏆</span>
              <div class="hero-badge-text">
                <strong>Certified Financial Coach</strong>
                <span>AFC® Credential</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════
         PAIN POINTS
    ═══════════════════════════════════════════════════ -->
    <section id="pain-points" aria-labelledby="pain-title">
      <div class="container">
        <h2 id="pain-title"></h2>
        <div id="pain-cards" data-stagger role="list"></div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════
         ABOUT
    ═══════════════════════════════════════════════════ -->
    <section id="about" aria-labelledby="about-title">
      <div class="container">
        <div class="about-inner">
          <div class="about-image-wrap reveal">
            <img
              id="about-image"
              src=""
              alt=""
              loading="lazy"
              width="440"
              height="520"
            />
            <div class="about-image-accent" aria-hidden="true"></div>
          </div>
          <div class="about-text reveal">
            <h2 id="about-title"></h2>
            <p id="about-bio"></p>
            <ul id="about-credentials" role="list"></ul>
            <div id="about-counters" role="region" aria-label="Key metrics"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════
         SERVICES
    ═══════════════════════════════════════════════════ -->
    <section id="services" aria-labelledby="services-title">
      <div class="container">
        <div class="section-header">
          <h2 id="services-title"></h2>
          <p id="services-subtext"></p>
        </div>
        <div id="services-cards" data-stagger role="list"></div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════
         HOW IT WORKS
    ═══════════════════════════════════════════════════ -->
    <section id="how-it-works" aria-labelledby="hiw-title">
      <div class="container">
        <div class="section-header">
          <h2 id="hiw-title"></h2>
          <p id="hiw-subtext"></p>
        </div>
        <div id="hiw-steps" data-stagger role="list"></div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════
         TESTIMONIALS
    ═══════════════════════════════════════════════════ -->
    <section id="testimonials" aria-labelledby="testimonials-title">
      <div class="container">
        <div class="section-header">
          <h2 id="testimonials-title"></h2>
          <p id="testimonials-subtext"></p>
        </div>
        <div id="testimonials-grid" data-stagger role="list"></div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════
         LEAD MAGNET
    ═══════════════════════════════════════════════════ -->
    <section id="lead-magnet" aria-labelledby="lm-title">
      <div class="container">
        <div class="lm-inner">
          <div class="lm-text reveal">
            <h2 id="lm-title"></h2>
            <p id="lm-subtext"></p>
          </div>
          <div class="lm-form-wrap reveal">
            <form
              id="lm-form"
              method="POST"
              action=""
              novalidate
              aria-label="Download the free budget guide">
              <input
                id="lm-email"
                type="email"
                name="EMAIL"
                placeholder="Enter your email address"
                required
                autocomplete="email"
                aria-label="Email address"
              />
              <!-- Mailchimp anti-bot field -->
              <div style="position:absolute;left:-5000px" aria-hidden="true">
                <input type="text" name="b_placeholder" tabindex="-1" value="" />
              </div>
              <button id="lm-btn" type="submit" class="btn btn-primary">Send Me the Free Guide</button>
            </form>
            <p class="lm-privacy" aria-live="polite">No spam, ever. Unsubscribe anytime.</p>
            <div id="lm-success" role="alert" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════
         FAQ
    ═══════════════════════════════════════════════════ -->
    <section id="faq" aria-labelledby="faq-title">
      <div class="container">
        <div class="section-header">
          <h2 id="faq-title"></h2>
        </div>
        <div id="faq-list" role="list"></div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════
         BOOKING + CALENDLY
    ═══════════════════════════════════════════════════ -->
    <section id="booking" aria-labelledby="booking-title">
      <div class="container">
        <div class="booking-header reveal">
          <h2 id="booking-title"></h2>
          <p id="booking-subtext"></p>
        </div>

        <div class="calendly-wrap reveal">
          <iframe
            id="calendly-iframe"
            src=""
            title="Book a free discovery call with Adam Reeves"
            loading="lazy"
            scrolling="no"
            frameborder="0"
          ></iframe>
        </div>

        <div class="backup-form-wrap reveal">
          <h3 id="backup-form-title"></h3>
          <p id="backup-form-subtext"></p>
          <form id="backup-contact-form" novalidate aria-label="Contact form">
            <div class="form-group">
              <label for="contact-name">Full Name</label>
              <input type="text" id="contact-name" name="name" placeholder="Your name" required autocomplete="name" />
            </div>
            <div class="form-group">
              <label for="contact-email">Email Address</label>
              <input type="email" id="contact-email" name="email" placeholder="your@email.com" required autocomplete="email" />
            </div>
            <div class="form-group">
              <label for="contact-message">Message</label>
              <textarea id="contact-message" name="message" placeholder="Tell me about your current financial situation and what you'd like to work on…" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Send Message</button>
            <div id="backup-form-msg" class="form-msg" role="alert" aria-live="polite" style="display:none"></div>
          </form>
        </div>
      </div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════════════════ -->
  <footer id="main-footer" role="contentinfo">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <div id="footer-logo"></div>
          <p id="footer-tagline"></p>
        </div>
        <div class="footer-col">
          <h4>Quick Links</h4>
          <ul id="footer-nav" role="list"></ul>
        </div>
        <div class="footer-col">
          <h4>Connect</h4>
          <div class="footer-social">
            <a id="footer-linkedin" href="#" target="_blank" rel="noopener noreferrer" aria-label="Adam Reeves on LinkedIn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M20.447 20.452H17.21v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.985V9h3.102v1.561h.046c.431-.816 1.484-1.676 3.054-1.676 3.264 0 3.867 2.149 3.867 4.944l-.007 6.623zM5.337 7.433a1.8 1.8 0 110-3.601 1.8 1.8 0 010 3.601zm1.551 13.019H3.785V9h3.103v11.452zM22.225 0H1.771C.792 0 0 .771 0 1.723v20.549C0 23.229.792 24 1.771 24h20.451C23.2 24 24 23.229 24 22.272V1.723C24 .771 23.2 0 22.222 0h.003z"/>
              </svg>
              LinkedIn
            </a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <span id="footer-copyright"></span>
        <div class="footer-policy">
          <a href="/privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>

</body>
</html>
